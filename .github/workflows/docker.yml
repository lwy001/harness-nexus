# Docker Hub image publish — tag-driven, in lockstep with the npm release.
#
# Publishing TWO images on every pushed vX.Y.Z tag (the same trigger as
# release.yml, so npm packages and images land together). Manual dispatch
# from main is the fallback — it publishes whatever the manifests say,
# unguarded by any tag (release.yml's fallback semantics; this is also the
# only way to publish images for an ALREADY-released version: re-pushing an
# old tag runs nothing, a workflow only fires if it exists in the tagged
# commit):
#   sinrimin/harness-nexus-server  ← root Dockerfile (Fastify API + MCP proxy)
#   sinrimin/harness-nexus-web     ← apps/web/Dockerfile (nginx SPA + reverse proxy)
#
# Credentials are ENVIRONMENT secrets on the `release` environment:
#   DOCKERHUB_USERNAME + DOCKERHUB_TOKEN (Docker Hub personal access token,
#   Read & Write, scoped to the two repos). The environment's deployment rule
#   restricts usage to v* tags; add required reviewers to the environment when
# collaborators join — this job declares `environment:` so pushes then pause
# for approval before touching Docker Hub.
#
# Image tags: v0.1.0-alpha.4 → 0.1.0-alpha.4 + latest. Pre-1.0 the alphas ARE
# latest (same policy as npm), so `latest=true` is forced — metadata-action's
# default skips prereleases.
#
# linux/amd64 only for now: arm64 would mean QEMU-emulated TS compiles
# (~30min+ per image). Add linux/arm64 to `platforms` + setup-qemu-action
# when someone actually needs arm images.
#
# Re-pushing the same tag rebuilds and re-pushes the same image tags — unlike
# npm, registry tags are mutable, so a retry just overwrites with identical
# content. The tag-must-match-manifests guard below is copied from release.yml
# so a mistyped tag fails BOTH workflows, never forks the version record.

name: docker

on:
  push:
    tags: ['v*']
  workflow_dispatch: # manual fallback — publishes the manifests' version from main

concurrency:
  group: docker # serialize — concurrent runs would race on the `latest` tag
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    # Tag runs: any vX.Y.Z. Dispatch: main only — never a feature branch's manifests.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: The tag must match the manifests (same guard as release.yml)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          ok=1
          for d in core shared sdk-ts mcp-runtime cli; do
            have=$(node -p "require('./packages/$d/package.json').version")
            if [ "$have" != "$want" ]; then
              echo "::error::packages/$d is $have but the tag wants $want — bump the manifests or re-tag"
              ok=0
            fi
          done
          [ "$ok" = 1 ]

      # One version feeds both trigger paths: tag runs read the tag (the guard
      # above already proved tag == manifests), dispatch runs read the
      # manifests (release.yml's fallback semantics).
      - name: Derive the version being published
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver=$(node -p "require('./packages/core/package.json').version")
          fi
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---- server image (root Dockerfile) --------------------------------------
      - uses: docker/metadata-action@v5
        id: meta-server
        with:
          images: sinrimin/harness-nexus-server
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
          flavor: |
            latest=true

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          # No provenance attestation: it adds an `unknown/unknown` arch entry
          # to the manifest list that renders confusingly on Docker Hub.
          provenance: false
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- web image (apps/web/Dockerfile; context stays the repo root) -------
      # Runs after the server build on purpose: both Dockerfiles share identical
      # dependency layers, so buildx's in-job layer cache makes the second
      # `pnpm install` nearly free.
      - uses: docker/metadata-action@v5
        id: meta-web
        with:
          images: sinrimin/harness-nexus-web
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
          flavor: |
            latest=true

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- Docker Hub overviews (#15) -----------------------------------------
      # The repos' descriptions start EMPTY (Docker Hub has no default from the
      # image itself). PATCH the Hub API with a short line + the markdown kept
      # in docs/docker-hub/{server,web}.md. AUTH (two-run lesson): a
      # repo-scoped PAT authenticates the REGISTRY via basic auth but the Hub
      # v2 API rejects it (401); exchanging it for a session JWT at
      # /v2/users/login/ gets past auth but repo-scoped tokens still CANNOT
      # edit repo metadata (403) — that needs an ACCOUNT-level Read & Write
      # PAT in DOCKERHUB_TOKEN. Until then this step is deliberately
      # NON-BLOCKING (continue-on-error): images are already pushed, a
      # metadata shortfall must not fail the release.
      - name: Sync Docker Hub descriptions
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          jwt=$(curl -s -f -X POST https://hub.docker.com/v2/users/login/ \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg u "$DOCKERHUB_USERNAME" --arg p "$DOCKERHUB_TOKEN" \
              '{username: $u, password: $p}')" \
            | jq -r .token)
          sync_description() {
            local repo="$1" short="$2" file="$3"
            local body
            body=$(jq -n --arg d "$short" --rawfile md "$file" \
              '{description: $d, full_description: $md}')
            local code
            code=$(curl -s -o /dev/null -w '%{http_code}' -X PATCH \
              -H "Authorization: Bearer $jwt" \
              -H 'Content-Type: application/json' \
              -d "$body" \
              "https://hub.docker.com/v2/repositories/sinrimin/harness-nexus-$repo/")
            echo "hub description ($repo): HTTP $code"
            [ "$code" = 200 ]
          }
          sync_description server \
            'Harness Nexus server — Fastify REST API + MCP proxy + SQLite storage.' \
            docs/docker-hub/server.md
          sync_description web \
            'Harness Nexus web — nginx-served admin UI with a reverse proxy to the server.' \
            docs/docker-hub/web.md
