name: Feature request
description: Propose a new capability or a change in behavior.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard or impossible today? Lead with the problem, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should exist instead? Sketch the behavior you'd want to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - server / API
        - web UI
        - CLI (`hnx`)
        - daemon
        - MCP proxy
        - docs
        - other / not sure
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Larger features continue as a *Design discussion* issue once the
        problem is agreed — a maintainer will split one off if needed.
