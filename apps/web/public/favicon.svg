<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="7" fill="#0b1220" />
  <!-- three upstream signals converging on the nexus node -->
  <g stroke="#22d3ee" stroke-width="1.6" stroke-linecap="round" opacity="0.85">
    <path d="M6 9 L15 16" />
    <path d="M6 23 L15 16" />
    <path d="M9 16 L15 16" />
  </g>
  <g fill="#5e6b7a">
    <circle cx="6" cy="9" r="1.7" />
    <circle cx="6" cy="23" r="1.7" />
    <circle cx="9" cy="16" r="1.7" />
  </g>
  <!-- the nexus -->
  <circle cx="15" cy="16" r="3.4" fill="#22d3ee" />
  <circle cx="15" cy="16" r="3.4" fill="none" stroke="#0b1220" stroke-width="0.6" />
  <!-- re-exposed fan-out -->
  <g stroke="#22d3ee" stroke-width="1.6" stroke-linecap="round" opacity="0.55">
    <path d="M15 16 L26 16" />
  </g>
  <circle cx="26" cy="16" r="1.7" fill="#5e6b7a" />
</svg>
