# Harness Nexus — full stack (API server + web SPA) in two containers.
#
# The `web` service (nginx) is the only externally reachable entry point: it
# serves the SPA and reverse-proxies /api and /mcp to `server`. The backend
# stays on the internal compose network only.
#
# Usage:
#   1. cp .env.example .env   then fill in JWT_SECRET (required) and others.
#   2. docker compose up --build -d        # build from source, OR
#      docker compose pull && docker compose up -d   # run the published images
#   3. Open http://<host>:15921
#
# Images are published to Docker Hub on every vX.Y.Z tag
# (.github/workflows/docker.yml): sinrimin/harness-nexus-server / -web.

services:
  # --- API + MCP server ------------------------------------------------------
  # Built by the root Dockerfile (multi-stage, pnpm deploy). No host ports —
  # only reachable from `web` via the compose network. `build:` stays primary
  # (deploys run from source); `image:` is the tag local builds get and what
  # `docker compose pull` fetches from Docker Hub.
  server:
    build: .
    image: sinrimin/harness-nexus-server:latest
    container_name: harness-nexus-server
    expose:
      - '8080'
    volumes:
      - ./data:/data
    env_file:
      - .env
    restart: unless-stopped

  # --- web SPA (nginx) + reverse proxy ---------------------------------------
  # Build context is the repo root so pnpm can resolve the workspace; the
  # Dockerfile lives under apps/web/Dockerfile. Same build/image duality as
  # `server` above.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: sinrimin/harness-nexus-web:latest
    container_name: harness-nexus-web
    ports:
      # Bind to localhost on a private port. The public HTTPS entry is the host
      # Caddy (see /etc/caddy/Caddyfile), which listens on :15921 publicly and
      # reverse-proxies to this internal port. 127.0.0.1 keeps plain HTTP off
      # the public interface. (15922, NOT 15921 — Caddy owns public 15921.)
      - '127.0.0.1:15922:80'
    depends_on:
      server:
        condition: service_healthy # wait for backend HEALTHCHECK to pass
    restart: unless-stopped
